spring:
  application:
    name: NEEDIT-BE

  datasource:
    url: jdbc:mysql://localhost:3306/needit
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  kafka:

    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:

      key-serializer: org.apache.kafka.common.serialization.StringSerializer

      value-serializer: org.apache.kafka.common.serialization.StringSerializer

    consumer:

      group-id: needit-user-actions-group

      auto-offset-reset: earliest

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ap-northeast-2

logging:
  level:
    org.springframework.web.socket.messaging: INFO
    org.springframework.messaging.simp.stomp: INFO
    com.needitbe.global.security.StompAuthChannelInterceptor: INFO

